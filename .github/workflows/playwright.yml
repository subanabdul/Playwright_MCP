name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to test
        required: true
        default: main
        type: string
      retries:
        description: Number of retries per failed test
        required: true
        default: '1'
        type: string
      workers:
        description: Number of Playwright workers
        required: true
        default: '1'
        type: string

  permissions:
    contents: read
    pages: write
    id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch || github.ref }}
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      id: playwright
      continue-on-error: true
      env:
        PW_RETRIES: ${{ inputs.retries || '1' }}
        PW_WORKERS: ${{ inputs.workers || '1' }}
      run: xvfb-run --auto-servernum npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Prepare GitHub Pages report
      if: ${{ !cancelled() }}
      run: touch playwright-report/.nojekyll
    - name: Configure GitHub Pages
      if: ${{ !cancelled() }}
      uses: actions/configure-pages@v5
    - name: Upload GitHub Pages artifact
      if: ${{ !cancelled() }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: playwright-report/
    - name: Fail workflow when tests fail
      if: ${{ steps.playwright.outcome == 'failure' }}
      run: exit 1

  deploy-report:
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy report to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
    - name: Add report link to workflow summary
      run: echo "Playwright HTML report: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
